name: C++ Memory and FD Leak Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Valgrind and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind gdb

      - name: Create test directory
        run: mkdir -p logs

      - name: Build project
        id: build
        continue-on-error: true
        run: |
          make CFLAGS="-Wall -Wextra -Werror -MMD -g" > build_log.txt 2>&1 || {
            echo "Build failed with status $?"
            cat build_log.txt
            exit 1
          }

      - name: Extract build errors
        if: steps.build.outcome == 'failure'
        id: extract_errors
        run: |
          if [ -f build_log.txt ]; then
            echo "error_details<<EOF" >> $GITHUB_OUTPUT
            cat build_log.txt | grep -B 1 -A 3 "error:" | head -20 >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "error_details=Build log file not found" >> $GITHUB_OUTPUT
          fi

      - name: Check build status
        if: steps.build.outcome == 'failure'
        id: build_check
        run: |
          echo "::error::Build failed! Cannot proceed with memory and FD checks."
          
          # Create clearer step summary with proper error details
          echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Fix compilation errors before running memory checks." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ -f build_log.txt ]; then
            grep -B 1 -A 3 "error:" build_log.txt | head -20 >> $GITHUB_STEP_SUMMARY
          else
            echo "Build log file not found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          exit 1

      - name: Run Valgrind checks
        id: valgrind-test
        if: steps.build.outcome != 'failure'
        run: |
          # Write valgrind script
          cat > run_valgrind.sh << 'EOF'
          #!/bin/bash
          exec valgrind --leak-check=full \
                        --show-leak-kinds=all \
                        --track-fds=yes \
                        --child-silent-after-fork=yes \
                        --error-exitcode=1 \
                        --log-file=logs/valgrind.log \
                        ./ircserv 8080 pass
          EOF
          
          chmod +x run_valgrind.sh
          
          # Run the server in background
          ./run_valgrind.sh &
          SERVER_PID=$!
          
          # Wait for server to initialize (5 seconds max)
          for i in {1..5}; do
            if nc -z localhost 8080; then
              break
            fi
            sleep 1
          done
          
          # Check if server is still running
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "::error::Server failed to start properly"
            echo "server_status=failed" >> $GITHUB_OUTPUT
            # Create empty log file so artifact upload doesn't fail
            touch logs/valgrind.log
            exit 1
          fi
          
          # Send shutdown signal
          kill -INT $SERVER_PID
          
          # Wait for graceful shutdown (10 seconds max)
          if ! timeout 10 bash -c "while kill -0 $SERVER_PID 2>/dev/null; do sleep 0.1; done"; then
            echo "::error::Server did not exit gracefully"
            echo "server_status=hanging" >> $GITHUB_OUTPUT
            kill -TERM $SERVER_PID
            exit 1
          fi
          
          # Process valgrind results
          if [ ! -f logs/valgrind.log ]; then
            echo "::error::Valgrind log file not found"
            echo "valgrind_status=no_log" >> $GITHUB_OUTPUT
            # Create empty log file so artifact upload doesn't fail
            touch logs/valgrind.log
            exit 1
          fi
          
          # Check for FD leaks
          if grep -q "FILE DESCRIPTORS: " logs/valgrind.log; then
            fd_leak_count=$(awk '
              /Open file descriptor/ {
                fd_line = $0;
                getline;
                if ($0 !~ /inherited from parent/ && $0 !~ /valgrind\.log/)
                  leaks++;
              }
              END { print leaks+0 }
            ' logs/valgrind.log)
            
            if [ "$fd_leak_count" -gt 0 ]; then
              echo "::error::Found $fd_leak_count file descriptor leaks!"
              echo "fd_leaks=true" >> $GITHUB_OUTPUT
              echo "fd_leak_count=$fd_leak_count" >> $GITHUB_OUTPUT
              echo "fd_leak_details<<EOF" >> $GITHUB_OUTPUT
              awk '
                /Open file descriptor/ {
                  fd_entry = $0;
                  getline;
                  if ($0 !~ /inherited from parent/ && $0 !~ /valgrind\.log/)
                    print fd_entry "\n" $0;
                }
              ' logs/valgrind.log >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi

          # Check for memory leaks
          if grep -q "definitely lost:" logs/valgrind.log; then
            memory_leaks=$(grep "definitely lost:" logs/valgrind.log | grep -v "0 bytes in 0 blocks")
            if [ -n "$memory_leaks" ]; then
              echo "::error::Found memory leaks!"
              echo "memory_leaks=true" >> $GITHUB_OUTPUT
              echo "leak_summary<<EOF" >> $GITHUB_OUTPUT
              grep -A 30 "LEAK SUMMARY:" logs/valgrind.log >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi
          
          echo "valgrind_passed=true" >> $GITHUB_OUTPUT

      - name: Upload Valgrind log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-log
          path: |
            logs/valgrind.log
            build_log.txt
          if-no-files-found: warn

      - name: Process results
        if: github.event_name == 'pull_request' && always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install GitHub CLI if needed
          if ! command -v gh &> /dev/null; then
            sudo apt-get install -y gh
          fi
          
          # Create summary based on build status
          if [[ "${{ steps.build.outcome }}" == "failure" ]]; then
            # Use echo commands instead of heredoc for better control
            echo "### ❌ Build Failed" > comment.md
            echo "" >> comment.md
            echo "\`\`\`" >> comment.md
            if [ -f build_log.txt ]; then
              grep -B 1 -A 3 "error:" build_log.txt | head -20 >> comment.md
            else
              echo "Build log file not found" >> comment.md
            fi
            echo "\`\`\`" >> comment.md
            echo "" >> comment.md
            echo "Fix compilation errors before running memory checks." >> comment.md
            echo "" >> comment.md
            echo "📊 [See Build Log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> comment.md
            
            # Post comment to PR
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
            exit 0
          fi
          
          # Check for server start/shutdown issues
          if [[ "${{ steps.valgrind-test.outputs.server_status }}" == "failed" ]]; then
            # Use echo commands instead of heredoc
            echo "### ❌ Server Failed to Start" > comment.md
            echo "" >> comment.md
            echo "Your IRC server failed to start properly for the memory test." >> comment.md
            echo "" >> comment.md
            echo "📊 [See Full Report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> comment.md
            
            # Post comment to PR
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
            exit 0
          fi
          
          if [[ "${{ steps.valgrind-test.outputs.server_status }}" == "hanging" ]]; then
            # Use echo commands instead of heredoc
            echo "### ❌ Server Did Not Shut Down Gracefully" > comment.md
            echo "" >> comment.md
            echo "Your IRC server did not respond to the shutdown signal within the timeout period." >> comment.md
            echo "" >> comment.md
            echo "📊 [See Full Report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> comment.md
            
            # Post comment to PR
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
            exit 0
          fi
          
          # Create summary for valgrind results
          if [[ "${{ steps.valgrind-test.outputs.valgrind_passed }}" == "true" ]]; then
            # Write to step summary
            echo "### ✅ Memory and FD Checks Passed" >> $GITHUB_STEP_SUMMARY
            echo "🎉 No memory leaks or file descriptor leaks detected!" >> $GITHUB_STEP_SUMMARY
            
            # Use echo commands instead of heredoc
            echo "### ✅ Memory and FD Checks Passed" > comment.md
            echo "" >> comment.md
            echo "🎉 All checks passed successfully!" >> comment.md
            echo "" >> comment.md
            echo "📊 [Full Report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> comment.md
            
            # Post comment to PR
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
          else
            # Write to step summary
            echo "### ❌ Memory and FD Checks Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Use echo commands instead of heredoc
            echo "### ❌ Memory and FD Checks Failed" > comment.md
            echo "" >> comment.md
            
            if [[ "${{ steps.valgrind-test.outputs.fd_leaks }}" == "true" ]]; then
              # Write to step summary
              echo "⚠️ Found ${{ steps.valgrind-test.outputs.fd_leak_count }} file descriptor leaks:" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "```" >> $GITHUB_STEP_SUMMARY
              echo "${{ steps.valgrind-test.outputs.fd_leak_details }}" >> $GITHUB_STEP_SUMMARY
              echo "```" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              
              # Write to PR comment
              echo "⚠️ Found ${{ steps.valgrind-test.outputs.fd_leak_count }} file descriptor leaks:" >> comment.md
              echo "" >> comment.md
              echo "\`\`\`" >> comment.md
              echo "${{ steps.valgrind-test.outputs.fd_leak_details }}" >> comment.md
              echo "\`\`\`" >> comment.md
              echo "" >> comment.md
            fi
            
            if [[ "${{ steps.valgrind-test.outputs.memory_leaks }}" == "true" ]]; then
              # Write to step summary
              echo "⚠️ Found memory leaks:" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "```" >> $GITHUB_STEP_SUMMARY
              echo "${{ steps.valgrind-test.outputs.leak_summary }}" >> $GITHUB_STEP_SUMMARY
              echo "```" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              
              # Write to PR comment
              echo "⚠️ Found memory leaks:" >> comment.md
              echo "" >> comment.md
              echo "\`\`\`" >> comment.md
              echo "${{ steps.valgrind-test.outputs.leak_summary }}" >> comment.md
              echo "\`\`\`" >> comment.md
              echo "" >> comment.md
            fi
            
            echo "📊 [Full Report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> $GITHUB_STEP_SUMMARY
            echo "📊 [Full Report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> comment.md
            
            # Post comment to PR
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
          fi