name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Simple binary cache for installed packages
      - name: Cache installed packages
        id: cache-valgrind
        uses: actions/cache@v4
        with:
          path: ~/.local/apt-archives
          key: ubuntu-valgrind-apt-${{ hashFiles('.github/workflows/c-cpp.yml') }}

      # Set up valgrind - install from cache or from apt
      - name: Install Valgrind with dependencies
        run: |
          # Disable man-db updates to speed up installation
          sudo rm -f /var/lib/man-db/auto-update
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          
          sudo mkdir -p /var/cache/apt/archives
          
          # Check if we have cache
          if [[ -d ~/.local/apt-archives && "$(ls -A ~/.local/apt-archives)" ]]; then
            echo "Using cached apt packages"
            sudo cp ~/.local/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          else
            echo "No cache found - will create one"
            mkdir -p ~/.local/apt-archives
          fi
          
          # Install valgrind and dependencies with man-db updates disabled
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends valgrind gdb
          
          # Cache the .deb files for next time
          cp /var/cache/apt/archives/*.deb ~/.local/apt-archives/ 2>/dev/null || true
          echo "Cached $(ls -1 ~/.local/apt-archives | wc -l) .deb files for future runs"
          
          # Verify valgrind is available
          valgrind --version

      # Build project
      - name: Build project
        run: make CFLAGS="-Wall -Wextra -Werror -MMD -g"

      - name: Run Valgrind checks for fd leaks
        run: |
          mkdir -p logs
          cat > run_valgrind.sh << 'EOF'
          #!/bin/bash
          exec valgrind --leak-check=full \
                        --show-leak-kinds=all \
                        --track-fds=yes \
                        --child-silent-after-fork=yes \
                        --error-exitcode=1 \
                        --log-file=logs/valgrind.log \
                        ./ircserv 8080 pass
          EOF
          
          chmod +x run_valgrind.sh
          
          # Define color codes for better visibility
          GREEN='\033[0;32m'
          RED='\033[0;31m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          BOLD='\033[1m'
          NC='\033[0m' # No Color
          
          echo -e "${BLUE}${BOLD}=== STARTING VALGRIND TEST ====${NC}"
          
          # Run the script in background
          ./run_valgrind.sh &
          SERVER_PID=$!
          
          # Wait for server to initialize
          echo -e "${YELLOW}Waiting for server initialization...${NC}"
          sleep 5
          
          # Send shutdown signal
          echo -e "${YELLOW}Sending shutdown signal to server...${NC}"
          kill -INT $SERVER_PID
          
          # Wait for graceful shutdown
          echo -e "${YELLOW}Waiting for server shutdown...${NC}"
          timeout 10 bash -c "while kill -0 $SERVER_PID 2>/dev/null; do sleep 0.1; done" || \
            (echo -e "${RED}${BOLD}ERROR: Server did not exit gracefully${NC}" && kill -TERM $SERVER_PID && exit 1)
          
          echo -e "${BLUE}${BOLD}=== ANALYZING VALGRIND RESULTS ====${NC}"
          
          # Check valgrind log for fd leaks
          if grep -q "FILE DESCRIPTORS: " logs/valgrind.log; then
            echo -e "${YELLOW}${BOLD}Checking for fd leaks...${NC}"
            
            # Use awk to properly parse multiline fd entries
            fd_leak_count=$(awk '
              /Open file descriptor/ {
                fd_line = $0;
                getline;
                if ($0 !~ /inherited from parent/ && $0 !~ /valgrind\.log/)
                  leaks++;
              }
              END { print leaks+0 }
            ' logs/valgrind.log)
            
            if [ "$fd_leak_count" -gt 0 ]; then
              echo -e "${RED}${BOLD}⚠️ FAILED: Found $fd_leak_count file descriptor leaks! ⚠️${NC}"
              # Show the leaking FDs and exit with error
              awk '
                /Open file descriptor/ {
                  fd_entry = $0;
                  getline;
                  if ($0 !~ /inherited from parent/ && $0 !~ /valgrind\.log/)
                    print fd_entry "\n" $0;
                }
              ' logs/valgrind.log
              grep -A 30 "FILE DESCRIPTORS:" logs/valgrind.log
              exit 1
            else
              echo -e "${GREEN}${BOLD}✅ PASSED: No file descriptor leaks detected.${NC}"
            fi
          else
            echo -e "${RED}${BOLD}⚠️ ERROR: Valgrind did not report file descriptor information.${NC}"
            exit 1
          fi

          # Check for memory leaks
          if grep -q "definitely lost:" logs/valgrind.log; then
            memory_leaks=$(grep "definitely lost:" logs/valgrind.log | grep -v "0 bytes in 0 blocks")
            if [ -n "$memory_leaks" ]; then
              echo -e "${RED}${BOLD}⚠️ FAILED: Found memory leaks! ⚠️${NC}"
              grep -A 30 "LEAK SUMMARY:" logs/valgrind.log
              exit 1
            else
              echo -e "${GREEN}${BOLD}✅ PASSED: No memory leaks detected.${NC}"
            fi
          fi
          
          echo -e "${BLUE}${BOLD}=== VALGRIND TEST COMPLETED ====${NC}"

      # Upload Valgrind log
      - name: Upload Valgrind log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-log
          path: logs/valgrind.log