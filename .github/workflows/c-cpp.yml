name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cache APT packages with extended dependencies
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /tmp/apt-cache
          key: Linux-apt-valgrind-extended-${{ hashFiles('.github/workflows/c-cpp.yml') }}
          restore-keys: |
            Linux-apt-valgrind-extended-
            Linux-apt-

      # Set up APT caching properly
      - name: Setup APT cache directory
        run: |
          sudo mkdir -p /tmp/apt-cache
          sudo chown -R $USER:$USER /tmp/apt-cache
          sudo rm -rf /var/cache/apt/archives
          sudo ln -s /tmp/apt-cache /var/cache/apt/archives

      # Install dependencies with caching all related packages
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-update valgrind gdb libbabeltrace1 libc6-dbg libdebuginfod-common libdebuginfod1t64 libipt2 libsource-highlight-common libsource-highlight4t64

      # Build project
      - name: Build project
        run: make CFLAGS="-Wall -Wextra -Werror -MMD -g"

      - name: Run Valgrind checks for fd leaks
        run: |
          mkdir -p logs
                   # Create a script to run the server with Valgrind
          cat > run_valgrind.sh << 'EOF'
          #!/bin/bash
          # Run valgrind - no need to close inherited fds
          exec valgrind --leak-check=full \
                        --show-leak-kinds=all \
                        --track-fds=yes \
                        --child-silent-after-fork=yes \
                        --error-exitcode=1 \
                        --log-file=logs/valgrind.log \
                        ./ircserv 8080 pass
          EOF
          
          chmod +x run_valgrind.sh
          
          # Define color codes for better visibility
          GREEN='\033[0;32m'
          RED='\033[0;31m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          BOLD='\033[1m'
          NC='\033[0m' # No Color
          
          echo -e "${BLUE}${BOLD}=== STARTING VALGRIND TEST ====${NC}"
          
          # Run the script in background
          ./run_valgrind.sh &
          SERVER_PID=$!
          
          # Wait for server to initialize
          echo -e "${YELLOW}Waiting for server initialization...${NC}"
          sleep 5
          
          # Send shutdown signal
          echo -e "${YELLOW}Sending shutdown signal to server...${NC}"
          kill -INT $SERVER_PID
          
          # Wait for graceful shutdown (max 10 seconds)
          echo -e "${YELLOW}Waiting for server shutdown...${NC}"
          timeout 10 bash -c "while kill -0 $SERVER_PID 2>/dev/null; do sleep 0.1; done" || \
            (echo -e "${RED}${BOLD}ERROR: Server did not exit gracefully${NC}" && kill -TERM $SERVER_PID && exit 1)
          
          echo -e "${BLUE}${BOLD}=== ANALYZING VALGRIND RESULTS ====${NC}"
          
                    # Check valgrind log for fd leaks
          if grep -q "FILE DESCRIPTORS: " logs/valgrind.log; then
            echo -e "${YELLOW}${BOLD}Checking for fd leaks...${NC}"
            
            # Extract full fd sections including the "inherited from parent" line
            valgrind_output=$(cat logs/valgrind.log)
            
            # Use awk to properly parse multiline fd entries
            fd_leak_count=$(awk '
              /Open file descriptor/ {
                fd_line = $0;
                getline;
                if ($0 !~ /inherited from parent/ && $0 !~ /valgrind\.log/)
                  leaks++;
              }
              END { print leaks+0 }  # +0 to convert null to 0
            ' logs/valgrind.log)
            
            if [ "$fd_leak_count" -gt 0 ]; then
              echo -e "${RED}${BOLD}⚠️ FAILED: Found $fd_leak_count file descriptor leaks! ⚠️${NC}"
              echo -e "${RED}----------------------------------------${NC}"
              # Show actual leaking file descriptors
              awk '
                /Open file descriptor/ {
                  fd_entry = $0;
                  getline;
                  if ($0 !~ /inherited from parent/ && $0 !~ /valgrind\.log/)
                    print fd_entry "\n" $0;
                }
              ' logs/valgrind.log
              echo -e "${RED}----------------------------------------${NC}"
              # Show the full FD section for context
              grep -A 30 "FILE DESCRIPTORS:" logs/valgrind.log
              echo -e "${RED}----------------------------------------${NC}"
              exit 1
            else
              echo -e "${GREEN}${BOLD}✅ PASSED: No file descriptor leaks detected. All non-standard FDs are inherited.${NC}"
            fi
          else
            echo -e "${RED}${BOLD}⚠️ ERROR: Valgrind did not report file descriptor information.${NC}"
            exit 1
          fi

          # Check for memory leaks
                    # Check for memory leaks
          if grep -q "definitely lost:" logs/valgrind.log; then
            memory_leaks=$(grep "definitely lost:" logs/valgrind.log | grep -v "0 bytes in 0 blocks")
            if [ -n "$memory_leaks" ]; then
              echo -e "${RED}${BOLD}⚠️ FAILED: Found memory leaks! ⚠️${NC}"
              echo -e "${RED}----------------------------------------${NC}"
              grep -A 30 "LEAK SUMMARY:" logs/valgrind.log
              echo -e "${RED}----------------------------------------${NC}"
              exit 1
            else
              echo -e "${GREEN}${BOLD}✅ PASSED: No memory leaks detected.${NC}"
            fi
          fi
          
          echo -e "${BLUE}${BOLD}=== VALGRIND TEST COMPLETED ====${NC}"

      # Upload Valgrind log
      - name: Upload Valgrind log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-log
          path: logs/valgrind.log