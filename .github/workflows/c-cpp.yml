name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cache APT packages (including Valgrind's .deb files)
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      # 3. Install Valgrind (will use cached .deb files if available)
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      # 4. Build with your Makefile
      - name: Build project
        run: make CFLAGS="-Wall -Wextra -Werror -MMD -g"

           - name: Run Valgrind checks
        run: |
          mkdir -p logs
          # Start server in background through Valgrind
          valgrind --leak-check=full \
                   --show-leak-kinds=all \
                   --track-fds=yes \
                   --error-exitcode=1 \
                   --log-file=logs/valgrind.log \
                   ./ircserv 8080 pass &
          SERVER_PID=$!
          
          # Give server time to initialize
          sleep 5
          
          # Send SIGINT to trigger graceful shutdown
          kill -INT $SERVER_PID
          
          # Wait for server to exit with timeout
          timeout 10 bash -c "while kill -0 $SERVER_PID 2>/dev/null; do sleep 0.1; done" || \
            (echo "Server did not exit gracefully" && kill -TERM $SERVER_PID && exit 1)
            
      # 6. Upload Valgrind log as artifact
      - name: Upload Valgrind log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-log
          path: logs/valgrind.log
