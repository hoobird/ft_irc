name: C++ Valgrind checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Simple binary cache for installed packages
      - name: Cache installed packages
        id: cache-valgrind
        uses: actions/cache@v4
        with:
          path: ~/.local/apt-archives
          key: ubuntu-valgrind-apt-${{ hashFiles('.github/workflows/c-cpp.yml') }}

      # Set up valgrind - install from cache or from apt
      - name: Install Valgrind with dependencies
        run: |
          # Disable man-db updates to speed up installation
          sudo rm -f /var/lib/man-db/auto-update
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          
          sudo mkdir -p /var/cache/apt/archives
          
          # Check if we have cache
          if [[ -d ~/.local/apt-archives && "$(ls -A ~/.local/apt-archives)" ]]; then
            echo "Using cached apt packages"
            sudo cp ~/.local/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          else
            echo "No cache found - will create one"
            mkdir -p ~/.local/apt-archives
          fi
          
          # Install valgrind and dependencies with man-db updates disabled
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends valgrind gdb
          
          # Cache the .deb files for next time
          cp /var/cache/apt/archives/*.deb ~/.local/apt-archives/ 2>/dev/null || true
          echo "Cached $(ls -1 ~/.local/apt-archives | wc -l) .deb files for future runs"
          
          # Verify valgrind is available
          valgrind --version

      # Build project
      - name: Build project
        run: make CFLAGS="-Wall -Wextra -Werror -MMD -g"

      - name: Run Valgrind checks for fd leaks
        id: valgrind-test
        run: |
          mkdir -p logs
          cat > run_valgrind.sh << 'EOF'
          #!/bin/bash
          exec valgrind --leak-check=full \
                        --show-leak-kinds=all \
                        --track-fds=yes \
                        --child-silent-after-fork=yes \
                        --error-exitcode=1 \
                        --log-file=logs/valgrind.log \
                        ./ircserv 8080 pass
          EOF
          
          chmod +x run_valgrind.sh
          
          # Run the script in background
          ./run_valgrind.sh &
          SERVER_PID=$!
          
          # Wait for server to initialize
          sleep 5
          
          # Send shutdown signal
          kill -INT $SERVER_PID
          
          # Wait for graceful shutdown
          timeout 10 bash -c "while kill -0 $SERVER_PID 2>/dev/null; do sleep 0.1; done" || \
            (echo "::error::Server did not exit gracefully" && kill -TERM $SERVER_PID && exit 1)
          
          # Check valgrind log for fd leaks
          if grep -q "FILE DESCRIPTORS: " logs/valgrind.log; then
            # Use awk to properly parse multiline fd entries
            fd_leak_count=$(awk '
              /Open file descriptor/ {
                fd_line = $0;
                getline;
                if ($0 !~ /inherited from parent/ && $0 !~ /valgrind\.log/)
                  leaks++;
              }
              END { print leaks+0 }
            ' logs/valgrind.log)
            
            if [ "$fd_leak_count" -gt 0 ]; then
              echo "::error::Found $fd_leak_count file descriptor leaks!"
              # Save leak info for later use
              FD_LEAKS=$(awk '
                /Open file descriptor/ {
                  fd_entry = $0;
                  getline;
                  if ($0 !~ /inherited from parent/ && $0 !~ /valgrind\.log/)
                    print fd_entry "\n" $0;
                }
              ' logs/valgrind.log)
              echo "fd_leaks=true" >> $GITHUB_OUTPUT
              echo "fd_leak_count=$fd_leak_count" >> $GITHUB_OUTPUT
              echo "fd_leak_details<<EOF" >> $GITHUB_OUTPUT
              echo "$FD_LEAKS" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "::error::Valgrind did not report file descriptor information."
            exit 1
          fi

          # Check for memory leaks
          if grep -q "definitely lost:" logs/valgrind.log; then
            memory_leaks=$(grep "definitely lost:" logs/valgrind.log | grep -v "0 bytes in 0 blocks")
            if [ -n "$memory_leaks" ]; then
              echo "::error::Found memory leaks!"
              LEAK_SUMMARY=$(grep -A 30 "LEAK SUMMARY:" logs/valgrind.log)
              echo "memory_leaks=true" >> $GITHUB_OUTPUT
              echo "leak_summary<<EOF" >> $GITHUB_OUTPUT
              echo "$LEAK_SUMMARY" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi
          
          echo "valgrind_passed=true" >> $GITHUB_OUTPUT

      # Upload Valgrind log
      - name: Upload Valgrind log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-log
          path: logs/valgrind.log

            - name: Process Valgrind results
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Update GitHub CLI to ensure we have reaction support
          sudo apt-get update
          sudo apt-get install -y gh
          
          # Check if Valgrind passed
          if [[ "${{ steps.valgrind-test.outputs.valgrind_passed }}" == "true" ]]; then
            # PR Summary
            cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### ✅ Valgrind Checks Passed
          
          🎉 No memory leaks or file descriptor leaks detected!
          
          [Full Report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF
          
            # PR Comment
            COMMENT_FILE=$(mktemp)
            cat <<EOF > "$COMMENT_FILE"
          ### ✅ Valgrind Checks Passed
          
          🎉 All memory and file descriptor checks passed successfully!
          
          📊 [Full Report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF
            
            gh pr comment ${{ github.event.pull_request.number}} --body-file "$COMMENT_FILE"
            rm "$COMMENT_FILE"
            gh pr react ${{ github.event.pull_request.number}} --reaction "+1"
          else
            # Handle failures
            FAILURE_MESSAGE="### ❌ Valgrind Checks Failed\n\n"
            
            if [[ "${{ steps.valgrind-test.outputs.fd_leaks }}" == "true" ]]; then
              FAILURE_MESSAGE+="⚠️ Found ${{ steps.valgrind-test.outputs.fd_leak_count }} file descriptor leaks:\n\n"
              FAILURE_MESSAGE+="\`\`\`\n${{ steps.valgrind-test.outputs.fd_leak_details }}\n\`\`\`\n\n"
            fi
            
            if [[ "${{ steps.valgrind-test.outputs.memory_leaks }}" == "true" ]]; then
              FAILURE_MESSAGE+="⚠️ Found memory leaks:\n\n"
              FAILURE_MESSAGE+="\`\`\`\n${{ steps.valgrind-test.outputs.leak_summary }}\n\`\`\`\n\n"
            fi
            
            FAILURE_MESSAGE+="📊 [Full Report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            
            # PR Summary
            echo -e "$FAILURE_MESSAGE" >> $GITHUB_STEP_SUMMARY
            
            # PR Comment
            COMMENT_FILE=$(mktemp)
            echo -e "$FAILURE_MESSAGE" > "$COMMENT_FILE"
            
            gh pr comment ${{ github.event.pull_request.number}} --body-file "$COMMENT_FILE"
            rm "$COMMENT_FILE"
            gh pr react ${{ github.event.pull_request.number}} --reaction "eyes"
            
            exit 1
          fi