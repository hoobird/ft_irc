name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cache APT packages to speed up Valgrind installation
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      # 3. Install Valgrind
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      # 4. Build with your Makefile
      - name: Build project
        run: make CFLAGS="-Wall -Wextra -Werror -MMD -g"

      # 5. Run Valgrind memory leak check with proper process management
      - name: Run Valgrind checks
        run: |
          mkdir -p logs
          # Start server through Valgrind in background
          valgrind --leak-check=full \
                   --show-leak-kinds=all \
                   --track-fds=yes \
                   --error-exitcode=1 \
                   --log-file=logs/valgrind.log \
                   ./ircserv 8080 pass &
          SERVER_PID=$!
          
          # Give server time to initialize
          sleep 5
          
          # Send SIGINT for graceful shutdown
          kill -INT $SERVER_PID
          
          # Wait for process to exit with timeout
          TIMEOUT=10
          ELAPSED=0
          while kill -0 $SERVER_PID 2>/dev/null && [ $ELAPSED -lt $TIMEOUT ]; do
            sleep 1
            ELAPSED=$((ELAPSED + 1))
          done
          
          # Force kill if still running
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "Server did not exit gracefully - sending SIGTERM"
            kill -TERM $SERVER_PID
            sleep 1
            # Final attempt with SIGKILL if needed
            if kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server still not terminated - sending SIGKILL"
              kill -KILL $SERVER_PID
            fi
            exit 1
          fi

      # 6. Upload Valgrind log as artifact (even if previous step failed)
      - name: Upload Valgrind log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-log
          path: logs/valgrind.log
