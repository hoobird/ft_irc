name: Cppcheck CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Cppcheck
        uses: deep5050/cppcheck-action@v3.0
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          std: c++03
          output_file: cppcheck-report.txt
          other_options: srcs/ --enable=all --inconclusive
          force: enable

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.txt

      - name: Process results
        if: github.event_name == 'pull_request'
        run: |
          # Check for errors using 'error:' pattern
          if grep -q 'error:' cppcheck-report.txt; then
            ISSUE_COUNT=$(grep -c 'error:' cppcheck-report.txt)
            
            # PR Summary
            echo "### ❌ Cppcheck Found $ISSUE_COUNT Issues" >> $GITHUB_STEP_SUMMARY
            echo "[Full Report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep 'error:' cppcheck-report.txt | head -n 10 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            
            # PR Comment
            COMMENT="### ❌ Cppcheck Found $ISSUE_COUNT Issues\n\n"
            COMMENT+="⚠️ Static analysis problems detected:\n\n"
            COMMENT+="\`\`\`\n"
            COMMENT+="$(grep 'error:' cppcheck-report.txt | head -n 5)\n"
            COMMENT+="\`\`\`\n\n"
            COMMENT+="📊 [Full Report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            
            gh pr comment ${{ github.event.pull_request.number}} --body "$COMMENT"
            gh pr react ${{ github.event.pull_request.number}} --reaction "eyes"
            
            # Exit with error
            echo "::error::Cppcheck found $ISSUE_COUNT issues"
            exit 1
          else
            echo "### ✅ Cppcheck Passed" >> $GITHUB_STEP_SUMMARY
            echo "[Full Report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> $GITHUB_STEP_SUMMARY
            
            gh pr comment ${{ github.event.pull_request.number}} --body "### ✅ Cppcheck Passed\n\n🎉 No static analysis issues found!"
            gh pr react ${{ github.event.pull_request.number}} --reaction "+1"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
